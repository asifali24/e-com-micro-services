spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: orders-service
              uri: lb://ORDERS-SERVICES
              predicates:
                - Path=/api/v1/orders/**
              filters:
                - StripPrefix=2
                - name : OrderRouteLoggingFilter
            - id: inventory-service
              uri: lb://INVENTORY-SERVICES
              predicates:
                - Path=/api/v1/inventory/**
              filters:
                - StripPrefix=3

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
